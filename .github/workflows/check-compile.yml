name: Rust Compile Check
on:
  pull_request:
    branches:
      - main

# Least privilege: compile check only needs to read the repo.
# Fixes CodeQL actions/missing-workflow-permissions (alert 1).
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo check