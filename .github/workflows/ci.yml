name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege: all jobs only read the repo (check/fmt/clippy/test/web/build).
# Fixes CodeQL actions/missing-workflow-permissions (alerts 3-8).
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build the SPA so the embedded-assets regression tests in
      # src/portal/static_serve.rs assert against a real dist instead of
      # the tracked stub (they skip when no /assets/ refs are embedded).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web portal
        run: cd web && npm ci && npm run build
      - run: cargo test

  # ADR-0025 Linux CI (a): default AppArmor userns restriction — fail-closed /
  # blocked-by-system-settings (tests 16, 30).
  sandbox-linux-default:
    name: Sandbox Linux (default AppArmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Sandbox unit/integration (expect blocked or fail-closed)
        run: cargo test -p rustfox --lib sandbox:: -- --nocapture

  # ADR-0025 Linux CI (b): userns enabled — smoke bwrap then confinement (11, 17).
  sandbox-linux-userns:
    name: Sandbox Linux (userns enabled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: bwrap smoke (fail job if sandbox cannot start)
        run: bwrap --ro-bind / / true
      - name: Confinement tests
        env:
          RUSTFOX_EXPECT_SANDBOX_OK: "1"
        run: cargo test -p rustfox --lib sandbox:: -- --nocapture

  # ADR-0025 macOS Seatbelt integration.
  sandbox-macos:
    name: Sandbox macOS (Seatbelt)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Seatbelt sandbox tests
        run: cargo test -p rustfox --lib sandbox:: -- --nocapture

  web:
    name: Web portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # typecheck + vite build + vitest (src/api/sse, chat stream, boot
      # watcher, router guards) — the M1 frontend gates.
      - name: Verify web portal
        run: cd web && npm ci && npm run verify

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy, test, web]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
