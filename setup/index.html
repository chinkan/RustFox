<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RustFox Setup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #1a1f2e;
    border: 1px solid #2d3748;
    border-radius: 16px;
    width: 100%;
    max-width: 700px;
    padding: 2.5rem;
    margin-top: 2rem;
  }
  /* Progress bar */
  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-label { font-size: 0.75rem; color: #718096; margin-bottom: 0.5rem; }
  .progress-bar { height: 4px; background: #2d3748; border-radius: 2px; }
  .progress-fill { height: 100%; background: #f6851b; border-radius: 2px; transition: width 0.3s ease; }
  /* Steps nav (compact chips) */
  .steps-nav { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .step-chip {
    flex: 1;
    min-width: 0;
    padding: 0.45rem 0.6rem;
    border-radius: 8px;
    background: #2d3748;
    color: #718096;
    font-size: 0.75rem;
    text-align: center;
    border: 1px solid #2d3748;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .step-chip.active { background: #f6851b; color: #fff; border-color: #f6851b; font-weight: 600; }
  .step-chip.done { background: #1a4731; color: #68d391; border-color: #1a4731; }
  /* Global toggle row */
  .global-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .global-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    cursor: pointer;
    color: #a0aec0;
    font-size: 0.82rem;
    user-select: none;
  }
  .global-toggle input { accent-color: #f6851b; width: 15px; height: 15px; cursor: pointer; }
  .global-toggle:hover { color: #e2e8f0; }
  /* Existing config banner */
  .existing-banner {
    background: #1a2744;
    border: 1px solid #2b4a8a;
    border-radius: 8px;
    padding: 0.65rem 0.875rem;
    font-size: 0.82rem;
    color: #90cdf4;
    flex: 1;
    min-width: 240px;
  }
  .existing-banner strong { color: #bee3f8; }
  /* Steps */
  .step { display: none; }
  .step.active { display: block; }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
  h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.25rem; color: #cbd5e0; }
  h3 { font-size: 0.95rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #cbd5e0; }
  p.subtitle { color: #718096; margin-bottom: 1.5rem; line-height: 1.6; }
  code { background: #2d3748; border-radius: 4px; padding: 0.1em 0.35em; font-size: 0.85em; }
  /* Form elements */
  .field { margin-bottom: 1.25rem; }
  .field-row { display: flex; gap: 0.85rem; }
  .field-row .field { flex: 1; }
  label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.4rem; color: #cbd5e0; }
  label .hint { font-weight: 400; color: #718096; margin-left: 0.4rem; }
  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%;
    background: #0f1117;
    border: 1px solid #2d3748;
    border-radius: 8px;
    color: #e2e8f0;
    padding: 0.6rem 0.875rem;
    font-size: 0.9rem;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #f6851b;
  }
  input.error, textarea.error { border-color: #fc8181; }
  .error-msg { color: #fc8181; font-size: 0.8rem; margin-top: 0.3rem; display: none; }
  .error-msg.visible { display: block; }
  textarea { resize: vertical; min-height: 90px; }
  input[type=checkbox] { accent-color: #f6851b; width: 16px; height: 16px; cursor: pointer; }
  /* Buttons */
  .btn-row { display: flex; gap: 0.75rem; justify-content: space-between; margin-top: 2rem; }
  button {
    padding: 0.6rem 1.4rem;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover:not(:disabled) { opacity: 0.85; }
  button:disabled { opacity: 0.45; cursor: default; }
  .btn-primary { background: #f6851b; color: #fff; }
  .btn-secondary { background: #2d3748; color: #e2e8f0; }
  /* Advanced collapsible section */
  .advanced-section {
    margin-top: 1.5rem;
    border: 1px solid #2d3748;
    border-radius: 10px;
    background: #131825;
    overflow: hidden;
  }
  .advanced-section > .advanced-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0.75rem 1rem;
    background: none;
    border: none;
    color: #cbd5e0;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    border-radius: 0;
  }
  .advanced-section > .advanced-header:hover { color: #e2e8f0; opacity: 1; }
  .advanced-section > .advanced-header .chevron {
    color: #f6851b;
    font-size: 0.7rem;
    transition: transform 0.2s ease;
    margin-left: 0.5rem;
  }
  .advanced-section.collapsed > .advanced-header .chevron { transform: rotate(-90deg); }
  .advanced-section > .advanced-body {
    padding: 0.25rem 1.25rem 1.25rem 1.25rem;
    border-top: 1px solid #2d3748;
  }
  .advanced-section.collapsed > .advanced-body { display: none; }
  /* MCP tools */
  .mcp-category { margin-bottom: 1.5rem; }
  .mcp-category h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin-bottom: 0.75rem; margin-top: 0; }
  .mcp-tool {
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .mcp-tool:hover { border-color: #4a5568; }
  .mcp-tool.selected { border-color: #f6851b; background: #1e2432; }
  .mcp-tool-header { display: flex; align-items: center; gap: 0.75rem; }
  .mcp-tool-header input[type=checkbox] { accent-color: #f6851b; width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .mcp-tool-name { font-weight: 600; font-size: 0.9rem; }
  .mcp-tool-desc { font-size: 0.8rem; color: #718096; margin-left: 1.75rem; margin-top: 0.2rem; }
  .mcp-tool-cmd { font-size: 0.75rem; color: #4a5568; font-family: monospace; margin-left: 1.75rem; margin-top: 0.15rem; }
  .mcp-env-fields { margin-left: 1.75rem; margin-top: 0.75rem; display: none; }
  .mcp-env-fields.visible { display: block; }
  .mcp-env-fields .env-row { margin-bottom: 0.5rem; }
  .mcp-env-label { font-size: 0.75rem; color: #718096; margin-bottom: 0.2rem; }
  .mcp-env-fields input { font-family: monospace; font-size: 0.82rem; }
  /* MCP prereqs box */
  .mcp-prereqs {
    background: #131825;
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.5rem;
    font-size: 0.82rem;
    color: #718096;
    line-height: 1.7;
  }
  .mcp-prereqs strong { color: #cbd5e0; }
  .mcp-prereqs a { color: #f6851b; text-decoration: none; }
  .mcp-prereqs a:hover { text-decoration: underline; }
  /* Per-tool docs link */
  .mcp-tool-link {
    margin-left: auto;
    font-size: 0.72rem;
    color: #4a5568;
    text-decoration: none;
    flex-shrink: 0;
    padding: 0.1rem 0.3rem;
  }
  .mcp-tool-link:hover { color: #f6851b; }
  /* Per-tool setup guide */
  .mcp-setup-guide {
    margin-left: 1.75rem;
    margin-top: 0.6rem;
    background: #131825;
    border: 1px solid #2d3748;
    border-radius: 6px;
    padding: 0.55rem 0.75rem;
    font-size: 0.78rem;
    color: #718096;
    line-height: 1.75;
  }
  .mcp-setup-guide strong { color: #cbd5e0; }
  .mcp-setup-guide a { color: #f6851b; text-decoration: none; }
  .mcp-setup-guide a:hover { text-decoration: underline; }
  /* Find more footer */
  .mcp-more {
    margin-top: 1.25rem;
    font-size: 0.8rem;
    color: #718096;
    text-align: center;
  }
  .mcp-more a { color: #f6851b; text-decoration: none; }
  .mcp-more a:hover { text-decoration: underline; }
  /* OAuth guide button */
  .btn-guide {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    margin-left: 1.75rem;
    margin-top: 0.55rem;
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    border: 1px solid #f6851b;
    background: transparent;
    color: #f6851b;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-guide:hover { background: #f6851b; color: #fff; opacity: 1; }
  /* OAuth connect button + row */
  .oauth-connect-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-left: 1.75rem;
    margin-top: 0.55rem;
    flex-wrap: wrap;
  }
  .btn-oauth-connect {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 1rem;
    border-radius: 6px;
    border: none;
    background: #2b6cb0;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-oauth-connect:hover { background: #2c5282; }
  .btn-oauth-connect:disabled { opacity: 0.55; cursor: not-allowed; }
  .oauth-connect-status {
    font-size: 0.82rem;
    font-weight: 500;
    color: #718096;
  }
  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #1a1f2e;
    border: 1px solid #2d3748;
    border-radius: 16px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 2rem;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    color: #718096;
    font-size: 1.25rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .modal-close:hover { color: #e2e8f0; opacity: 1; }
  .modal-box h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 0.3rem;
    margin-top: 0;
  }
  .modal-subtitle {
    font-size: 0.8rem;
    color: #718096;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }
  /* OAuth step list */
  .oauth-steps { list-style: none; counter-reset: oauth-counter; }
  .oauth-step {
    counter-increment: oauth-counter;
    display: flex;
    gap: 0.875rem;
    margin-bottom: 1.25rem;
  }
  .oauth-step:last-child { margin-bottom: 0; }
  .oauth-step-num {
    flex-shrink: 0;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 50%;
    background: #f6851b;
    color: #fff;
    font-weight: 700;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 0.05rem;
  }
  .oauth-step-body { flex: 1; }
  .oauth-step-title {
    font-weight: 600;
    font-size: 0.9rem;
    color: #e2e8f0;
    margin-bottom: 0.3rem;
  }
  .oauth-step-desc {
    font-size: 0.8rem;
    color: #a0aec0;
    line-height: 1.65;
  }
  .oauth-step-desc a {
    color: #f6851b;
    text-decoration: none;
    font-weight: 600;
  }
  .oauth-step-desc a:hover { text-decoration: underline; }
  .scope-list {
    margin: 0.4rem 0 0 0;
    padding: 0.5rem 0.75rem;
    background: #0f1117;
    border: 1px solid #2d3748;
    border-radius: 6px;
    list-style: none;
  }
  .scope-list li {
    font-family: monospace;
    font-size: 0.73rem;
    color: #68d391;
    padding: 0.1rem 0;
    line-height: 1.7;
  }
  .oauth-warning {
    margin-top: 1.25rem;
    padding: 0.6rem 0.875rem;
    background: #2d1a0a;
    border: 1px solid #744210;
    border-radius: 8px;
    font-size: 0.78rem;
    color: #fbd38d;
    line-height: 1.6;
  }
  /* Custom MCP server section */
  .custom-mcp-section { margin-top: 1.75rem; border-top: 1px solid #2d3748; padding-top: 1.25rem; }
  .custom-mcp-section h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin-bottom: 0.75rem; }
  .custom-card {
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 0.65rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
  }
  .custom-card-body { flex: 1; min-width: 0; }
  .custom-card-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
  .custom-card-cmd { font-size: 0.75rem; color: #4a5568; font-family: monospace; }
  .custom-card-env { font-size: 0.72rem; color: #718096; margin-top: 0.15rem; }
  .btn-remove { background: none; border: none; cursor: pointer; color: #718096; font-size: 1rem; padding: 0; line-height: 1; flex-shrink: 0; }
  .btn-remove:hover { color: #fc8181; opacity: 1; }
  .custom-add-form {
    border: 1px dashed #2d3748;
    border-radius: 8px;
    padding: 1rem;
    margin-top: 0.75rem;
  }
  .custom-add-form h4 { font-size: 0.85rem; font-weight: 600; color: #cbd5e0; margin-bottom: 0.75rem; }
  .cmd-row { display: flex; gap: 0.5rem; }
  .cmd-row select {
    background: #0f1117;
    border: 1px solid #2d3748;
    border-radius: 8px;
    color: #e2e8f0;
    padding: 0.6rem 0.5rem;
    font-size: 0.9rem;
    min-width: 80px;
  }
  .env-add-row { display: flex; gap: 0.5rem; margin-bottom: 0.4rem; }
  .env-add-row input { flex: 1; }
  /* Config preview */
  pre {
    background: #0f1117;
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 1rem;
    font-size: 0.78rem;
    overflow: auto;
    max-height: 340px;
    color: #a0aec0;
    white-space: pre;
  }
  .success-msg { color: #68d391; font-size: 0.9rem; margin-top: 1rem; display: none; }
  .success-msg.visible { display: block; }
  /* Review summary */
  .summary-list {
    background: #131825;
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 0.85rem 1rem;
    font-size: 0.85rem;
    line-height: 1.85;
    color: #cbd5e0;
  }
  .summary-list .summary-row { display: flex; gap: 0.5rem; }
  .summary-list .summary-key { color: #718096; min-width: 9rem; }
  .summary-list .summary-val { color: #e2e8f0; word-break: break-word; flex: 1; }
  .summary-list .summary-val.muted { color: #4a5568; font-style: italic; }
  .summary-section { margin-bottom: 1.25rem; }
  .summary-section h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin-bottom: 0.4rem; margin-top: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="progress-wrap">
    <div class="progress-label" id="progress-label">Step 1 of 4</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:25%"></div></div>
  </div>
  <div class="global-row">
    <div class="existing-banner" id="existing-banner" style="display:none">
      <strong>Editing existing configuration</strong> — pre-loaded from <code>config.toml</code>.
    </div>
  </div>
  <div id="steps-container"></div>
  <div class="btn-row">
    <button class="btn-secondary" id="btn-back" onclick="prevStep()" style="display:none">← Back</button>
    <button class="btn-primary" id="btn-next" onclick="nextStep()">Continue →</button>
  </div>
</div>

<!-- OAuth Setup Modal -->
<script>
const state = {
  provider: 'openrouter',
  telegram_token: '',
  openrouter_key: '',
  openrouter_model: '',
  ollama_model: '',
  system_prompt: '',
  ollama_running: false,
  ollama_models: [],
};

const WIZARD_STEPS = 2;
const TOTAL_STEPS = 3;
let currentStep = 1;

function showStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(n === TOTAL_STEPS ? 'step-done' : 'step-' + n);
  if (el) el.classList.add('active');
  currentStep = n;
  const btnNext = document.getElementById('btn-next');
  const btnBack = document.getElementById('btn-back');
  if (n === TOTAL_STEPS) {
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('progress-label').textContent = 'Setup complete!';
    btnBack.style.display = 'none';
    btnNext.style.display = 'none';
    return;
  }
  document.getElementById('progress-fill').style.width = ((n / WIZARD_STEPS) * 100) + '%';
  document.getElementById('progress-label').textContent = 'Step ' + n + ' of ' + WIZARD_STEPS;
  btnBack.style.display = n > 1 ? 'inline-block' : 'none';
  btnNext.style.display = 'inline-block';
  btnNext.disabled = false;
  btnNext.textContent = n === WIZARD_STEPS ? 'Save config.toml' : 'Continue →';
  if (n === WIZARD_STEPS) {
    collectStep();
    renderSummary();
    renderPreview();
  }
}

function prevStep() { if (currentStep > 1) showStep(currentStep - 1); }

function nextStep() {
  if (currentStep === 1 && !validateStep()) return;
  collectStep();
  if (currentStep === WIZARD_STEPS) { saveConfig(); return; }
  showStep(currentStep + 1);
}

function requireField(id, valid) {
  const el = document.getElementById(id);
  if (!el) return true;
  const errEl = el.parentElement.querySelector('.error-msg');
  const value = (el.value || '').trim();
  if (!value || (valid && !valid(value))) {
    el.classList.add('error');
    if (errEl) errEl.classList.add('visible');
    return false;
  }
  el.classList.remove('error');
  if (errEl) errEl.classList.remove('visible');
  return true;
}

function clearFieldError(el) {
  if (!el) return;
  el.classList.remove('error');
  const errEl = el.parentElement && el.parentElement.querySelector('.error-msg');
  if (errEl) errEl.classList.remove('visible');
}

function validateStep() {
  let ok = requireField('f-telegram-token') & requireField('f-system-prompt');
  if (state.provider === 'ollama') {
    if (!state.ollama_running) ok = 0;
    ok = requireField('f-ollama-model') & ok;
  } else {
    ok = requireField('f-openrouter-key') & requireField('f-openrouter-model', v => v.includes('/')) & ok;
  }
  return !!ok;
}

function collectStep() {
  const ollama = document.getElementById('f-provider-ollama');
  state.provider = ollama && ollama.checked ? 'ollama' : 'openrouter';
  state.telegram_token = (document.getElementById('f-telegram-token')?.value || '').trim();
  state.openrouter_key = (document.getElementById('f-openrouter-key')?.value || '').trim();
  state.openrouter_model = (document.getElementById('f-openrouter-model')?.value || '').trim();
  state.ollama_model = (document.getElementById('f-ollama-model')?.value || '').trim();
  state.system_prompt = (document.getElementById('f-system-prompt')?.value || '').trim();
}

function thinBody() {
  return {
    provider: state.provider,
    openrouter_api_key: state.provider === 'openrouter' ? state.openrouter_key : '',
    openrouter_model: state.provider === 'openrouter' ? state.openrouter_model : '',
    ollama_model: state.provider === 'ollama' ? state.ollama_model : '',
    bot_token: state.telegram_token,
    system_prompt: state.system_prompt,
  };
}

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function maskSecret(s) {
  if (!s) return '';
  if (s.length <= 8) return '••••';
  return s.slice(0, 4) + '••••' + s.slice(-4);
}

function useOpenRouter() {
  document.getElementById('f-provider-openrouter').checked = true;
  onProviderChange();
}

async function onProviderChange() {
  const ollama = document.getElementById('f-provider-ollama').checked;
  state.provider = ollama ? 'ollama' : 'openrouter';
  document.getElementById('openrouter-fields').style.display = ollama ? 'none' : 'block';
  document.getElementById('ollama-fields').style.display = ollama ? 'block' : 'none';
  if (ollama) await loadOllama();
}

async function loadOllama() {
  const down = document.getElementById('ollama-down');
  const localWrap = document.getElementById('ollama-local-wrap');
  const libraryWrap = document.getElementById('ollama-library-wrap');
  down.style.display = 'none';
  localWrap.style.display = 'none';
  libraryWrap.style.display = 'none';
  try {
    const res = await fetch('/api/ollama/local');
    const data = await res.json();
    state.ollama_running = !!data.running;
    state.ollama_models = data.models || [];
    if (!data.running) {
      down.textContent = data.message || 'Ollama is not running.';
      down.style.display = 'block';
      return;
    }
    const sel = document.getElementById('f-ollama-model');
    const previous = sel.value;
    sel.innerHTML = state.ollama_models.map(name =>
      `<option value="${escHtml(name)}">${escHtml(name)}</option>`
    ).join('');
    if (previous && state.ollama_models.indexOf(previous) !== -1) sel.value = previous;
    state.ollama_model = sel.value || '';
    localWrap.style.display = 'block';
    await loadLibrary(document.getElementById('f-ollama-search')?.value || '');
  } catch (e) {
    state.ollama_running = false;
    down.textContent = 'Ollama is not running.';
    down.style.display = 'block';
  }
}

let libraryTimer = null;
function scheduleLibrarySearch() {
  clearTimeout(libraryTimer);
  libraryTimer = setTimeout(() => {
    const q = document.getElementById('f-ollama-search');
    loadLibrary(q ? q.value : '');
  }, 250);
}

async function loadLibrary(query) {
  const err = document.getElementById('ollama-library-error');
  const libSel = document.getElementById('f-ollama-library');
  if (!libSel) return;
  if (err) err.style.display = 'none';
  let libData = null;
  try {
    const lib = await fetch('/api/ollama/library?q=' + encodeURIComponent(query || ''));
    libData = await lib.json();
  } catch (e) {
    libData = { ok: false, models: [], error: 'Could not load the Ollama library.' };
  }
  if (!libData || libData.ok === false) {
    libSel.innerHTML = '';
    if (err) {
      err.textContent = (libData && libData.error) || 'Could not load the Ollama library.';
      err.style.display = 'block';
    }
    return;
  }
  const have = new Set(state.ollama_models.map(n => String(n).split(':')[0]));
  const choices = (libData.models || []).filter(n => !have.has(n));
  libSel.innerHTML = choices.map(name =>
    `<option value="${escHtml(name)}">${escHtml(name)}</option>`
  ).join('');
}

function onOpenRouterModelPick() {
  const pick = document.getElementById('f-openrouter-model-pick');
  const field = document.getElementById('f-openrouter-model');
  if (!pick || !field || !pick.value) return;
  field.value = pick.value;
  clearFieldError(field);
}

async function loadOpenRouterModels() {
  const pick = document.getElementById('f-openrouter-model-pick');
  const field = document.getElementById('f-openrouter-model');
  if (!pick || !field) return;
  const res = await fetch('/api/openrouter/models');
  const data = await res.json();
  const models = data.models || [];
  const fallback = data.default || '';
  pick.innerHTML = models.map(name =>
    `<option value="${escHtml(name)}">${escHtml(name)}</option>`
  ).join('');
  const want = state.openrouter_model || fallback;
  if (want) {
    field.value = want;
    if (models.indexOf(want) !== -1) pick.value = want;
  }
  state.openrouter_model = (field.value || '').trim();
}

function showLibraryList() {
  document.getElementById('ollama-library-wrap').style.display = 'block';
}

async function pullLibraryModel() {
  const name = document.getElementById('f-ollama-library').value;
  const status = document.getElementById('ollama-pull-status');
  if (!name) return;
  status.textContent = 'Pulling ' + name + '…';
  try {
    const res = await fetch('/api/ollama/pull', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: name }),
    });
    const data = await res.json();
    if (!data.ok) {
      status.textContent = data.error || 'Ollama is not running.';
      return;
    }
    status.textContent = 'Pulled ' + name + '.';
    await loadOllama();
    const sel = document.getElementById('f-ollama-model');
    const match = Array.from(sel.options).find(o => o.value === name || o.value.indexOf(name + ':') === 0);
    if (match) sel.value = match.value;
    state.ollama_model = sel.value;
  } catch (e) {
    status.textContent = 'Ollama is not running.';
  }
}

function renderSummary() {
  const el = document.getElementById('summary');
  if (!el) return;
  const row = (k, v) => `<div class="summary-row"><div class="summary-key">${escHtml(k)}</div><div class="summary-val">${v}</div></div>`;
  const provider = state.provider === 'ollama' ? 'Ollama' : 'OpenRouter';
  const second = state.provider === 'ollama'
    ? escHtml(state.ollama_model || '(pick a model)')
    : escHtml(state.openrouter_key ? maskSecret(state.openrouter_key) : '(missing)');
  const modelRow = state.provider === 'ollama'
    ? ''
    : row('OpenRouter model', escHtml(state.openrouter_model || '(enter a model id)'));
  el.innerHTML =
    '<div class="summary-section"><h3>Setup</h3><div class="summary-list">' +
    row('Provider', escHtml(provider)) +
    row(state.provider === 'ollama' ? 'Ollama model' : 'OpenRouter key', second) +
    modelRow +
    row('Bot token', escHtml(state.telegram_token ? maskSecret(state.telegram_token) : '(missing)')) +
    row('System prompt', escHtml(state.system_prompt || '(missing)')) +
    '</div></div>';
}

async function renderPreview() {
  const pre = document.getElementById('config-preview');
  if (!pre) return;
  try {
    const res = await fetch('/api/thin-preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(thinBody()),
    });
    const data = await res.json();
    pre.textContent = data.ok ? data.config : (data.error || 'Could not preview config.');
  } catch (e) {
    pre.textContent = 'Could not preview config.';
  }
}

async function saveConfig() {
  const btn = document.getElementById('btn-next');
  btn.disabled = true;
  try {
    const res = await fetch('/api/thin-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(thinBody()),
    });
    const data = await res.json();
    if (!data.ok) {
      btn.disabled = false;
      alert(data.error || 'Server error saving config.');
      return;
    }
    showStep(TOTAL_STEPS);
  } catch (e) {
    btn.disabled = false;
    alert('Failed to save: ' + e.message);
  }
}

async function finishSetup() {
  try { await fetch('/api/shutdown', { method: 'POST' }); } catch (_) {}
}

async function installService() {
  const btn = document.getElementById('btn-install-service');
  const status = document.getElementById('service-install-status');
  btn.disabled = true;
  btn.textContent = 'Installing...';
  try {
    const res = await fetch('/api/install-service', { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      status.textContent = '✓ RustFox installed as a background service!';
      status.className = 'success-msg visible';
      btn.textContent = '✓ Installed';
    } else {
      status.textContent = '⚠ Service installation failed: ' + (data.error || 'unknown error') + '. You can retry later with: rustfox --service install';
      status.className = 'success-msg visible';
      status.style.color = '#fc8181';
      btn.disabled = false;
      btn.textContent = 'Retry install';
    }
  } catch (e) {
    status.textContent = '⚠ Error: ' + e.message;
    status.className = 'success-msg visible';
    status.style.color = '#fc8181';
    btn.disabled = false;
    btn.textContent = 'Retry install';
  }
}

async function loadExistingConfig() {
  try {
    const res = await fetch('/api/load-config');
    if (!res.ok) return;
    const cfg = await res.json();
    if (!cfg.exists) return;
    if (cfg.telegram_token && cfg.telegram_token !== '***') state.telegram_token = cfg.telegram_token;
    if (cfg.openrouter_key && cfg.openrouter_key !== '***') state.openrouter_key = cfg.openrouter_key;
    if (cfg.model) state.openrouter_model = cfg.model;
    if (cfg.system_prompt) state.system_prompt = cfg.system_prompt;
    state._loaded = true;
  } catch (_) {}
}

  const c = document.getElementById('steps-container');
  c.innerHTML = `<div class="step" id="step-1">

  <p class="subtitle">OpenRouter is the default. Pick a shortcut or type any model id. Everything else stays a safe default.</p>
  <div class="field">
    <label>Provider</label>
    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer">
      <input type="radio" name="provider" id="f-provider-openrouter" value="openrouter" checked onchange="onProviderChange()">
      <span>OpenRouter <span class="hint">— default</span></span>
    </label>
    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;margin-top:0.35rem">
      <input type="radio" name="provider" id="f-provider-ollama" value="ollama" onchange="onProviderChange()">
      <span>Ollama <span class="hint">— local option</span></span>
    </label>
  </div>
  <div id="openrouter-fields">
    <div class="field">
      <label>OpenRouter API Key <span class="hint">— <a href="https://openrouter.ai/keys" target="_blank" rel="noopener" style="color:#f6851b;text-decoration:none">openrouter.ai/keys</a></span></label>
      <input type="password" id="f-openrouter-key" placeholder="sk-or-..." value="${escHtml(state.openrouter_key)}" oninput="clearFieldError(this)">
      <div class="error-msg">API key is required.</div>
    </div>
    <div class="field">
      <label>OpenRouter model <span class="hint">— list is a shortcut · <a href="https://openrouter.ai/models" target="_blank" rel="noopener" style="color:#f6851b;text-decoration:none">openrouter.ai/models</a></span></label>
      <select id="f-openrouter-model-pick" onchange="onOpenRouterModelPick()"></select>
      <input type="text" id="f-openrouter-model" placeholder="provider/model" value="${escHtml(state.openrouter_model)}" oninput="clearFieldError(this)">
      <div class="error-msg">Model id is required (provider/model).</div>
    </div>
  </div>
  <div id="ollama-fields" style="display:none">
    <p id="ollama-down" class="error-msg visible" style="display:none">Ollama is not running.</p>
    <button type="button" class="btn-secondary" id="ollama-back" onclick="useOpenRouter()" style="margin-bottom:0.75rem">Use OpenRouter</button>
    <div id="ollama-local-wrap" style="display:none">
      <div class="field">
        <label>Ollama model <span class="hint">— detected on this machine</span></label>
        <select id="f-ollama-model"></select>
        <div class="error-msg">Pick a detected model.</div>
      </div>
      <button type="button" class="btn-secondary" onclick="showLibraryList()">Pull a model that is not on this machine</button>
      <div id="ollama-library-wrap" style="display:none;margin-top:0.75rem">
        <div class="field">
          <label>Ollama library <span class="hint">— from ollama.com, pulled after you pick</span></label>
          <input type="text" id="f-ollama-search" placeholder="Search the library" oninput="scheduleLibrarySearch()">
          <p id="ollama-library-error" class="error-msg visible" style="display:none"></p>
          <select id="f-ollama-library"></select>
        </div>
        <button type="button" class="btn-secondary" onclick="pullLibraryModel()">Pull</button>
        <p id="ollama-pull-status" class="hint"></p>
      </div>
    </div>
  </div>
  <div class="field">
    <label>Bot Token <span class="hint">— from @BotFather on Telegram</span></label>
    <input type="password" id="f-telegram-token" placeholder="1234567890:ABC-..." value="${escHtml(state.telegram_token)}" oninput="clearFieldError(this)">
    <div class="error-msg">Bot token is required.</div>
  </div>
  <div class="field">
    <label>System prompt <span class="hint">— one sentence</span></label>
    <input type="text" id="f-system-prompt" placeholder="Be brief and kind." value="${escHtml(state.system_prompt)}" oninput="clearFieldError(this)">
    <div class="error-msg">A sentence is required.</div>
  </div>
</div>
<div class="step" id="step-2">
  <h2>✅ Review &amp; Save</h2>
  <p class="subtitle">These four answers are what gets written. Everything else stays a safe default.</p>
  <div id="summary"></div>
  <details style="margin-top:1.25rem">
    <summary style="cursor:pointer;color:#a0aec0;font-size:0.85rem;font-weight:600">📋 Show raw TOML</summary>
    <pre id="config-preview" style="margin-top:0.75rem"></pre>
  </details>
</div>
<div class="step" id="step-done">
  <h1 style="margin-bottom:0.5rem">🎉 You're all set!</h1>
  <p class="subtitle"><code>config.toml</code> has been saved. Start your bot with:</p>
  <pre style="margin-bottom:2rem;text-align:center;font-size:0.95rem;color:#e2e8f0">cargo run --bin rustfox</pre>
  <div id="service-install-section" style="margin-top: 1.5rem; text-align: center;">
    <button id="btn-install-service" class="btn-primary" onclick="installService()">Install as background service</button>
    <p id="service-install-status" class="success-msg" style="margin-top: 0.75rem;"></p>
    <div style="margin-top: 1rem;">
      <button class="btn-secondary" onclick="finishSetup()">Close &amp; finish →</button>
    </div>

}

async function init() {
  await loadExistingConfig();
  buildSteps();
  try { await loadOpenRouterModels(); } catch (_) {}
  if (state._loaded) document.getElementById('existing-banner').style.display = 'block';
  showStep(1);
}
init();
</script>
